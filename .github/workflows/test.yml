name: Student Registration

# Run the tests on every push and on every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If test.py fails, it exits with code 1 and this step (and the workflow) fails.
      - name: Run tests
        run: python test.py
